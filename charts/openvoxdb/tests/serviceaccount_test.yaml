suite: service account scaffolding
templates:
  - templates/serviceaccount.yaml
tests:
  - it: creates no service account by default
    asserts:
      - hasDocuments:
          count: 0

  - it: creates a service account with standard labels
    release:
      name: test
    set:
      serviceAccount.create: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: test-openvoxdb
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: openvoxdb-0.2.0
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: openvoxdb
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: test
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: "8.15.0-main"
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  - it: supports name override
    release:
      name: test
    set:
      serviceAccount.create: true
      nameOverride: custom
    asserts:
      - equal:
          path: metadata.name
          value: test-custom
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: custom

  - it: supports fullname override
    set:
      serviceAccount.create: true
      fullnameOverride: custom-db
    asserts:
      - equal:
          path: metadata.name
          value: custom-db

  - it: supports explicit name and annotations
    set:
      serviceAccount.create: true
      serviceAccount.name: db-account
      serviceAccount.annotations:
        example.com/owner: platform
    asserts:
      - equal:
          path: metadata.name
          value: db-account
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
