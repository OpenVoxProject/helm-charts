suite: network policy
templates:
  - templates/networkpolicy.yaml
tests:
  - it: is omitted by default
    asserts:
      - hasDocuments:
          count: 0
  - it: denies ingress and egress by default when enabled
    release:
      name: test
    set:
      networkPolicy.enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: test-openvoxdb
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: openvoxdb
            app.kubernetes.io/instance: test
      - equal:
          path: spec.policyTypes
          value: [Ingress, Egress]
      - equal:
          path: spec.ingress
          value: []
      - equal:
          path: spec.egress
          value: []
  - it: preserves configured policy types and traffic rules
    set:
      networkPolicy.enabled: true
      networkPolicy.policyTypes: [Ingress]
      networkPolicy.additionalIngressRules:
        - ports:
            - protocol: TCP
              port: 8080
      networkPolicy.additionalEgressRules:
        - ports:
            - protocol: TCP
              port: 5432
    asserts:
      - equal:
          path: spec.policyTypes
          value: [Ingress]
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8080
      - equal:
          path: spec.egress[0].ports[0].port
          value: 5432
