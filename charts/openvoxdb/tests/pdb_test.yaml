suite: pod disruption budget
templates:
  - templates/pdb.yaml
tests:
  - it: is omitted by default
    asserts:
      - hasDocuments:
          count: 0
  - it: renders configured minimum availability and pod selectors
    set:
      podDisruptionBudget.enabled: true
      podDisruptionBudget.minAvailable: 2
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 2
      - notExists:
          path: spec.maxUnavailable
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: openvoxdb
            app.kubernetes.io/instance: RELEASE-NAME
  - it: uses maximum unavailability instead of minimum availability when supplied
    set:
      podDisruptionBudget.enabled: true
      podDisruptionBudget.maxUnavailable: 0
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 0
      - notExists:
          path: spec.minAvailable
