suite: service monitor
templates:
  - templates/servicemonitor.yaml
tests:
  - it: is omitted by default
    asserts:
      - hasDocuments:
          count: 0
  - it: rejects enabling the monitor without the exporter
    set:
      metrics.serviceMonitor.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: metrics.enabled must be true when metrics.serviceMonitor.enabled is true
  - it: selects the application service and named metrics port
    release:
      name: test
      namespace: monitoring-test
    set:
      metrics.enabled: true
      metrics.serviceMonitor.enabled: true
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: metadata.name
          value: test-openvoxdb
      - equal:
          path: metadata.namespace
          value: monitoring-test
      - equal:
          path: spec.namespaceSelector.matchNames
          value: [monitoring-test]
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: openvoxdb
            app.kubernetes.io/instance: test
      - equal:
          path: spec.endpoints[0]
          value:
            port: metrics
            path: /metrics
            interval: 30s
            honorLabels: true
  - it: monitors the application namespace when installed in a separate monitoring namespace
    release:
      namespace: application-test
    set:
      metrics.enabled: true
      metrics.serviceMonitor.enabled: true
      metrics.serviceMonitor.namespace: monitoring-test
    asserts:
      - equal:
          path: metadata.namespace
          value: monitoring-test
      - equal:
          path: spec.namespaceSelector.matchNames
          value: [application-test]
