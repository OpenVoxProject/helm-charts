{{- if and (include "openvoxdb.readDatabaseEnabled" .) (not .Values.readDatabase.existingSecret) }}
{{- $name := include "openvoxdb.readDatabaseSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "openvoxdb.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.readDatabase.passwordKey }}: {{ if .Values.readDatabase.password }}{{ .Values.readDatabase.password | b64enc | quote }}{{ else if and $existing $existing.data (hasKey $existing.data .Values.readDatabase.passwordKey) }}{{ index $existing.data .Values.readDatabase.passwordKey | quote }}{{ else }}{{ randAlphaNum 32 | b64enc | quote }}{{ end }}
{{- end }}
