# -- Override the chart name
nameOverride: ""
# -- Override the fully qualified app name
fullnameOverride: ""

# -- Container image repository
image:
  # -- Image repository
  repository: ghcr.io/voxpupuli/openvoxview
  # -- Image tag
  tag: v1.4.0
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Number of replicas
replicaCount: 1

# -- Container port for OpenVox View
port: 5000

# -- PuppetDB / OpenVox DB connection settings
puppetdb:
  # -- PuppetDB URL
  url: "https://puppetdb:8081"
  # -- Existing TLS secret name containing cert.pem and key.pem for client certificate authentication
  tlsSecretName: ""
  # -- Existing secret name containing the CA certificate (ca.pem)
  caSecretName: ""

# -- Additional environment variables as key-value pairs
extraEnv: {}
#  OPENVOXVIEW_DEFAULT_ENVIRONMENT: production

# -- Name of an existing secret to use as additional environment variables
extraEnvSecret: ""

# -- Container resource requests and limits
resources: {}
#  requests:
#    memory: 256Mi
#    cpu: 200m
#  limits:
#    memory: 512Mi
#    cpu: 500m

# -- Container security context
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- Pod security context
podSecurityContext: {}

# -- Node selector for pod assignment
nodeSelector: {}
# -- Tolerations for pod assignment
tolerations: []
# -- Affinity rules for pod assignment
affinity: {}
# -- Topology spread constraints for pod assignment
topologySpreadConstraints: []
# -- Priority class name
priorityClassName: ""

# -- Additional pod annotations
podAnnotations: {}
# -- Additional pod labels
podLabels: {}

# -- Deployment update strategy
updateStrategy:
  type: RollingUpdate

# -- Termination grace period in seconds
terminationGracePeriodSeconds: 30

# -- Service account configuration
serviceAccount:
  # -- Create a service account
  create: false
  # -- Service account name (generated if empty and create is true)
  name: ""
  # -- Service account annotations
  annotations: {}

# -- Pod disruption budget configuration
podDisruptionBudget:
  # -- Enable PDB
  enabled: false
  # -- Minimum available pods
  minAvailable: 1
  # -- Maximum unavailable pods (mutually exclusive with minAvailable)
  # maxUnavailable: 1

# -- Liveness probe configuration
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

# -- Readiness probe configuration
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# -- Startup probe configuration
startupProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 12

# -- Additional sidecar containers
extraContainers: []

# -- Additional volumes
extraVolumes: []

# -- Service configuration
service:
  # -- Service type
  type: ClusterIP
  # -- Service port
  port: 5000
  # -- Service annotations
  annotations: {}
  # -- Service labels
  labels: {}

# -- Ingress configuration
ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
  # -- Ingress hosts
  hosts: []
  #  - host: openvoxview.example.com
  #    paths:
  #      - path: /
  #        pathType: Prefix
  # -- Ingress TLS configuration
  tls: []
  #  - secretName: openvoxview-tls
  #    hosts:
  #      - openvoxview.example.com
