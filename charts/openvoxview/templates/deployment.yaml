apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openvoxview.fullname" . }}
  labels:
    {{- include "openvoxview.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "openvoxview.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "openvoxview.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openvoxview.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: openvoxview
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          env:
            - name: OPENVOXVIEW_PORT
              value: {{ .Values.port | quote }}
            - name: PUPPETDB_URL
              value: {{ .Values.puppetdb.url | quote }}
            {{- if .Values.puppetdb.tlsSecretName }}
            - name: PUPPETDB_CERT
              value: /etc/openvoxview/tls/cert.pem
            - name: PUPPETDB_KEY
              value: /etc/openvoxview/tls/key.pem
            {{- end }}
            {{- if .Values.puppetdb.caSecretName }}
            - name: PUPPETDB_CA
              value: /etc/openvoxview/ca/ca.pem
            {{- end }}
            {{- range $key, $value := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if .Values.extraEnvSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.extraEnvSecret }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.puppetdb.tlsSecretName .Values.puppetdb.caSecretName }}
          volumeMounts:
            {{- if .Values.puppetdb.tlsSecretName }}
            - name: tls
              mountPath: /etc/openvoxview/tls
              readOnly: true
            {{- end }}
            {{- if .Values.puppetdb.caSecretName }}
            - name: ca
              mountPath: /etc/openvoxview/ca
              readOnly: true
            {{- end }}
          {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.puppetdb.tlsSecretName .Values.puppetdb.caSecretName .Values.extraVolumes }}
      volumes:
        {{- if .Values.puppetdb.tlsSecretName }}
        - name: tls
          secret:
            secretName: {{ .Values.puppetdb.tlsSecretName }}
        {{- end }}
        {{- if .Values.puppetdb.caSecretName }}
        - name: ca
          secret:
            secretName: {{ .Values.puppetdb.caSecretName }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
