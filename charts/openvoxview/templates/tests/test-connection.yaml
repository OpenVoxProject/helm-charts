apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "openvoxview.fullname" . }}-test-connection"
  labels:
    {{- include "openvoxview.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.37
      command: ['wget']
      args: ['{{ include "openvoxview.fullname" . }}:{{ .Values.service.port }}', '-q', '-O', '/dev/null', '--timeout=5']
  restartPolicy: Never
