suite: deployment
templates:
  - templates/deployment.yaml
tests:
  - it: should render a Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1

  - it: should use the correct image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/voxpupuli/openvoxview:v1.4.0"

  - it: should set PuppetDB URL
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PUPPETDB_URL
            value: "https://puppetdb:8081"

  - it: should set security context
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: should not mount volumes without TLS secrets
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].volumeMounts
      - isNull:
          path: spec.template.spec.volumes

  - it: should mount TLS secret when configured
    set:
      puppetdb:
        url: "https://puppetdb:8081"
        tlsSecretName: my-tls
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls
            mountPath: /etc/openvoxview/tls
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls
            secret:
              secretName: my-tls
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PUPPETDB_CERT
            value: /etc/openvoxview/tls/cert.pem

  - it: should mount CA secret when configured
    set:
      puppetdb:
        url: "https://puppetdb:8081"
        caSecretName: my-ca
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ca
            mountPath: /etc/openvoxview/ca
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ca
            secret:
              secretName: my-ca

  - it: should set extra env vars
    set:
      extraEnv:
        OPENVOXVIEW_DEFAULT_ENVIRONMENT: production
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENVOXVIEW_DEFAULT_ENVIRONMENT
            value: "production"

  - it: should set envFrom when extraEnvSecret is configured
    set:
      extraEnvSecret: my-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: my-secret

  - it: should respect custom replica count
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should set pod annotations
    set:
      podAnnotations:
        prometheus.io/scrape: "true"
    asserts:
      - isNotNull:
          path: spec.template.metadata.annotations

  - it: should set node selector
    set:
      nodeSelector:
        disktype: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd

  - it: should set priority class name
    set:
      priorityClassName: system-cluster-critical
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: system-cluster-critical

  - it: should set topology spread constraints
    set:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: openvoxview
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname

  - it: should set update strategy
    set:
      updateStrategy:
        type: Recreate
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: should set termination grace period
    set:
      terminationGracePeriodSeconds: 60
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60

  - it: should use default service account when not created
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default

  - it: should use created service account
    set:
      serviceAccount:
        create: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-openvoxview

  - it: should use custom service account name
    set:
      serviceAccount:
        create: true
        name: my-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-sa

  - it: should render configurable probes
    set:
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 30
        periodSeconds: 60
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 30

  - it: should render startup probe
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 12

  - it: should render extra containers
    set:
      extraContainers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:latest
          ports:
            - containerPort: 4180
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: oauth2-proxy

  - it: should render extra volumes
    set:
      extraVolumes:
        - name: shared
          emptyDir: {}
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: shared
            emptyDir: {}
